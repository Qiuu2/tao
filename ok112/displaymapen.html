<script>
	var w=36,h=24,l=0,t=0,x=6,lb=5,ll=37;
	var mapx,mapy;
	var px=0,py=0;
	var typeid;
	var _marker;
	var _getterminalid;
	var opts = {
	  width : 200,     // 信息窗口宽度
	  height: 50     // 信息窗口高度
	 
	}


    //创建和初始化地图函数：
    function initMap(){
		
        window.map = new BMap.Map("container");
		var point = new BMap.Point(<{$longitude}>,<{$latitude}>);
        map.centerAndZoom(point,12);
		map.addEventListener("rightclick",function(e){
			px=e.point.lng;
			py=e.point.lat;
			//document.all.rightclick.style.visibility = "hidden";
			});
        map.enableScrollWheelZoom();
     	map.addControl(new BMap.NavigationControl());
		var contextMenu = new BMap.ContextMenu();
		var txtMenuItem = [
		  {
		   text:'magnify',
		   callback:function(){map.zoomIn()}
		  },
		  {
		   text:'reduce',
		   callback:function(){map.zoomOut()}
		  },
		  {
		   text:'maximum',
		   callback:function(){map.zoomTo(18)}
		  },
		  {
		   text:'Check the national',
		   callback:function(){map.zoomTo(4)}
		  },
		  {
		   text:'Add mark',
		   callback:function(p){
		 	//var iconImg = createIcon2(json.icon);
			//var marker = new BMap.Marker(p);
			//alert(mousePos(e).x);
			document.all._contents.style.top = mapy;
			document.all._contents.style.left = mapx;
			document.all._contents.style.visibility = "visible";
			//map.addOverlay(marker);
		   }
		  }
		 ];
		 for(var i=0; i < txtMenuItem.length; i++){
		  contextMenu.addItem(new BMap.MenuItem(txtMenuItem[i].text,txtMenuItem[i].callback,100));
		  if(i==1 || i==3) {
		   contextMenu.addSeparator();
		  }
		 }
		 map.addContextMenu(contextMenu);
		 
     	 //向地图中添加marker
    }

  	function _select()
	{
		var id = document.getElementById('audiosource').value;
		
		var url = "get_terminalnum.php?id="+id+"&longitude="+px+"&latitude="+py;
		updateterminaldate(url);
	
	
		for(var i=0;i<ret.length;i++)
		{
			var terminal1=ret.split("@")[0];
			var terminaltype=terminal1.split("#")[1];
			var terminal_ip=terminal1.split("#")[0];
			var terminal=ret.split("@")[1];
			var terminal_name=terminal.split("|")[0];
			var networkstate=terminal.split("|")[1];
		}
		
		if(terminaltype==0)
		{
			addMarker(w,h,l,t,x,lb,px,py,terminal_name,networkstate,id,terminal_ip);
		}
	else
		{
			addMarker(w,h,ll,t,x,lb,px,py,terminal_name,networkstate,id,terminal_ip);
		}
		
		document.all._contents.style.visibility = "hidden";
	}
	
	function _cancel()
	{	
		document.all._contents.style.visibility = "hidden";
	}
		
    //创建marker
    	window.addMarker = function (w,h,l,t,x,lb,p1,p2,name,netstate,id,terminalip){
       // map.clearOverlays();
            var p0 = p1;
            var p1 = p2;
            var point = new BMap.Point(p0,p1);
            var iconImg = createIcon(w,h,l,t,x,lb);
            var marker = new BMap.Marker(point,{icon:iconImg});
            var iw = createInfoWindow(name,netstate,terminalip);
            var label = new BMap.Label(name,{"offset":new BMap.Size(lb-x+30,-20)});
          	marker.setLabel(label);	
			map.addOverlay(marker);	 
			
			marker.addEventListener("rightclick", function(e){
			//	map.removeOverlay(marker); 
				_marker=marker;
				_getterminalid=id;
				document.all.rightclick.style.top = mapy;
				document.all.rightclick.style.left = mapx+20;
				document.all.rightclick.style.visibility = "visible";
			});  	   
         	label.setStyle({
                        borderColor:"#808080",
                        color:"#333",
                        cursor:"pointer"
            });
					
			(function(){
				var _iw = createInfoWindow(name,netstate,terminalip);
				var _marker = marker;
				_marker.addEventListener("click",function(){
				    this.openInfoWindow(_iw);
			    });
			    _iw.addEventListener("open",function(){
				    _marker.getLabel().hide();
			    })
			    _iw.addEventListener("close",function(){
				    _marker.getLabel().show();
			    })
				label.addEventListener("click",function(){
				    _marker.openInfoWindow(_iw);
			    })
				
			})()
			
    }
	function _delterminal()
	{
	
		var url = "del_terminalnum.php?id="+_getterminalid;
		delterminaldate(url);
		map.removeOverlay(_marker);
		
		document.all.rightclick.style.visibility = "hidden";
	}
	function test(e){
	//document.getElementById("mjs").innerHTML = mousePos(e).x+','+mousePos(e).y;
	mapx=mousePos(e).x;
	mapy=mousePos(e).y;
	    
	};
	function mousePos(e){
		var x,y;
		var e = e||window.event;
		return {
		x:e.clientX+document.body.scrollLeft+document.documentElement.scrollLeft,
		y:e.clientY+document.body.scrollTop+document.documentElement.scrollTop
		};
	};
    //创建InfoWindow
    function createInfoWindow(json,netstate,terminalip){
		var state;
		if(netstate==1)
			state="connect";
		else
			state="disconnect";
       var iw = new BMap.InfoWindow("<a class='iw_poi_title' href='http://" + terminalip + "' target=_blank>" + json + "</a><div class='iw_poi_content' >connection status："+state+"</div>",opts);
        return iw;
    }
    //创建一个Icon
    function createIcon(w,h,l,t,x,lb){
        var icon = new BMap.Icon("./skin/images/frame/6u.png", new BMap.Size(w,h),{imageOffset: new BMap.Size(-l,-t),infoWindowOffset:new BMap.Size(lb+5,1),offset:new BMap.Size(x,h)});
        return icon;
    }
    initMap();//创建和初始化地图

</script>
