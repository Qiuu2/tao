var preFrameW = '206,*';
var FrameHide = 0;
var curStyle = 1;
var totalItem = 9;
function ChangeMenu(way){
	var addwidth = 10;
	var fcol = top.document.all.btFrame.cols;
	if(way==1) addwidth = 10;
	else if(way==-1) addwidth = -10;
	else if(way==0){
		if(FrameHide == 0){
			preFrameW = top.document.all.btFrame.cols;
			top.document.all.btFrame.cols = '0,*';
			FrameHide = 1;
			return;
		}else{
			top.document.all.btFrame.cols = preFrameW;
			FrameHide = 0;
			return;
		}
	}
	fcols = fcol.split(',');
	fcols[0] = parseInt(fcols[0]) + addwidth;
	top.document.all.btFrame.cols = fcols[0]+',*';
}

function isNull( str )
{
	if ( str == "" || str==null) 
	return true;
	var regu = "^[ ]+$";
	var re = new RegExp(regu);
	return re.test(str);
}

String.prototype.trim=function() {    return this.replace(/(^\s*)|(\s*$)/g,'');}
function ajax_set_info(info1,info2,flag)
{
   createXMLHttpRequest();		
   xmlhttp.open( "get","set_factoryinfo.php?info1="+info1+"&info2="+info2+"&flag="+flag+"",true );
   xmlhttp.onreadystatechange = function()
   {
      if(xmlhttp.readyState == 4 )
      {
         if(xmlhttp.status == 200 )
         {
			var result=xmlhttp.responseText.trim();
			var strarray=result.split("##");
			var dealer=strarray[0];
			document.getElementById("setsealerinfo").innerHTML =dealer;
			var factory=strarray[1];
			document.getElementById("setfactoryinfo").innerHTML =factory;
		}
      }
   }
    xmlhttp.setRequestHeader( "If-Modified-Since", "0");
	xmlhttp.send(null);
}
