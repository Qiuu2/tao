<!--验证代码-->
<script language="javascript">
function isNull( str )
{
	if ( str == "" || str==null) 
	return true;
	var regu = "^[ ]+$";
	var re = new RegExp(regu);
	return re.test(str);
}
function isNumber( s )
{ 
	var regu = "^[0-9]+$"; 
	var re = new RegExp(regu); 
	if (s.search(re) != -1) 
	{ 
		return true; 
	}
	else 
	{ 
		return false; 
	} 
} 
function Check_mac(s)
{
	
	//mac地址正则表达式 
	 var reg_name = /[A-Fa-f0-9]{2}:[A-Fa-f0-9]{2}:[A-Fa-f0-9]{2}:[A-Fa-f0-9]{2}:[A-Fa-f0-9]{2}:[A-Fa-f0-9]{2}/;
	if(!reg_name.test(s)){ 
	
		return false; 
	} 

	return true; 

}
function trim(str)
{
   str=str.replace(/(^\s*)|(\s*$)/g,""); 
   return str;
}
</script>

	row++;

	 else

function deleteRow(obj)
{
	var getcurrenrownum=obj.parentNode.parentNode.rowIndex;
	var totalrownum = obj.parentNode.parentNode.parentNode.rows.length-1;
	var dispatchid = -1;
	if(totalrownum == 1)
	{
		dispatchid = document.getElementById('belltaskid').value;
	}
	if(totalrownum > 1)
	{
		dispatchid = document.getElementsByName('belltaskid')[getcurrenrownum-1].value;
	}
	if(dispatchid  == -1)
	{
		document.getElementById('coursetable').deleteRow(getcurrenrownum);
		row--;
		sign--;
	}
	else if(dispatchid  != -1)
	{
		var getreturnvalue = deldata("set_super_password.php?superpass=del_mac&id="+dispatchid+"");
		if(getreturnvalue == 1)
		{
			document.getElementById('coursetable').deleteRow(getcurrenrownum);
			row--;
			sign--;
		}
	}
}

	if(judge_mark == 1)

	else if (totalrownum > 1)
