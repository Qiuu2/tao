<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<title>Usermanager</title>

<link href="skin/css/main_page_style.css" rel="stylesheet" type="text/css" />
<style>
 
	/* 奇数行样式 */
	tr:nth-child(odd) {
		background-color: #ffffff;
	}
	
	/* 偶数行样式 */
	tr:nth-child(even) {
		background-color: #c1cfe0;
	}
</style>
<script type="text/javascript" src="skin/erweima/jquery.min.js"></script>
<script type="text/javascript" src="skin/erweima/qrcode.js"></script>
<script type="text/javascript">

function isNull( str )
{
	if ( str == "" || str==null) 
	return true;
	var regu = "^[ ]+$";
	var re = new RegExp(regu);
	return re.test(str);
}

function getCheckboxItem()
{
	var allSel="";
	if(document.form2.id.checked)
	{
		allSel=document.form2.id.value;
		if(allSel==undefined)
		{
			allSel="";
		}
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			if(allSel=="")
				allSel=document.form2.id[i].value;
			else
				allSel=allSel+","+document.form2.id[i].value;
		}
	}
	return allSel;
}

function getoneitem()
{
	var allSel="";
	var count=0;
	if(document.form2.id.checked)
	{
		allSel=document.form2.id.value;
		if(allSel==undefined)
		{
			allSel="";
		}
	}
	for(var i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{	
			count++;
			if(count>=2)
			{
				alert("<{$user_manager.select_one|capitalize}>");
				return void(0);
			}
		}
	}
	
	for(var i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{	
			allSel=document.form2.id[i].value;
			break;
		}
	}
	if( isNull(allSel) )
	{
		alert("<{$user_manager.Select_Users|capitalize}>");
		return void(0);
	}
	return allSel;	
}

function selAll(aid)
{
	if(aid==0)
	{
		document.form2.id.checked=true;
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(!document.form2.id[i].checked)
		{
			document.form2.id[i].checked=true;
		}
	}
}

function noSelAll(aid)
{
	if(aid==0)
	{
		document.form2.id.checked=false;
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			document.form2.id[i].checked=false;
		}
	}
}
function EnableUser()
{
	var qstr=getCheckboxItem();
	if(qstr==null||qstr=="")
	{
		alert("<{$user_manager.Select_Users|capitalize}>");
		return void(0);	
	}
	else
	{ 
			location="do.php?act=enable_msg&id="+qstr+"";
	}
}
function DisableUser()
{
	var qstr=getCheckboxItem();
	if(qstr==null||qstr=="")
	{
		alert("<{$user_manager.Select_Users|capitalize}>");
		return void(0);	
	}
	else
	{ 
			location="do.php?act=disable_msg&id="+qstr+"";
	}

}
function delUser()
{
	var qstr=getCheckboxItem();
	if(qstr==null||qstr=="")
	{
		alert("<{$user_manager.Select_Users|capitalize}>");
		return void(0);	
	}
	else
	{ 
		if(!window.confirm("<{$user_manager.confirm_deleting|capitalize}>"))
		{
			return void(0);
		}	
		else
		{
			location="do.php?act=userdel_msg&id="+qstr+"";
		}
	}
}

function usermodify()
{
	var getid = getoneitem();
	if(isNull(getid))
	{
		return void(0);
	}
	else
	{
		window.location.href="useredit.php?id="+getid+"";
	}
}
function view_user_terminal()
{
	var user_id = getoneitem();
	if(isNull(user_id))
	{
		return void(0);
	}
	else
	{
		window.location.href = "view_user_terminal.php?id="+user_id+"";
	}
}


</script>
</head>
<body>
