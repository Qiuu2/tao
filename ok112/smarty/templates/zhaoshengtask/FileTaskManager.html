//获得选中文件的文件名
function getCheckboxItem()
{
	var allSel="";
	
	if(document.form2.id.checked)
	{
		allSel=document.form2.id.value;
		
		if(allSel==undefined)
		{
			allSel="";
		}
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			if(allSel=="")
				allSel=document.form2.id[i].value;
			else
				allSel=allSel+","+document.form2.id[i].value;
		}
	}
	return allSel;
}

function selAll(aid)
{
	if(aid==0)
	{
		document.form2.id.checked=true;
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(!document.form2.id[i].checked)
		{
			document.form2.id[i].checked=true;
		}
	}
}
function noSelAll(aid)
{
	document.form2.id.checked=false;
	
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			document.form2.id[i].checked=false;
		}
	}
}
function getdayofweek(str)
{
   var dayofweek="";
   var count=0;
   for(i=0;i<str.length;i++)
   {
        if(str.charAt(i)=="1")
        {
			count++;
            switch(i)
            {
                case 0:
				dayofweek+="<{$Filetaskmanager.Sunday}>";
                
                break;
                case 1:
				dayofweek+="<{$Filetaskmanager.Monday}>";
                
                break;
                case 2:
				dayofweek+="<{$Filetaskmanager.Tuesday}>";
                
                break;
                case 3:
				dayofweek+="<{$Filetaskmanager.Wednesday}>";
                
                break;
                case 4:
				dayofweek+="<{$Filetaskmanager.Thursday}>";
                
                break;
                case 5:
				dayofweek+="<{$Filetaskmanager.Friday}>";
                
                break;
                case 6:
                dayofweek+="<{$Filetaskmanager.Saturday}>";
                break;  
            }
        }
   }
   if(count==7)
   {
   		return "<{$task_manager.every_day|capitalize}>";
   }
   return dayofweek;
}
