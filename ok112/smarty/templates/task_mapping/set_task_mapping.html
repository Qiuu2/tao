<script language="javascript">
function isNumber( s )
{
    var regu = "^[0-9]+$";
    var re = new RegExp(regu);
    if (s.search(re) != -1) 
    {
        return true;
    }
    else 
    {
        return false;
    }
}
function trim(str)
{   
    return str.replace(/(^\s*)|(\s*$)/ig, "");   
}
function isChinaOrNumbOrLett( s )
{
	var regu = "^[0-9a-zA-Z\u4e00-\u9fa5]+$"; 

	var re = new RegExp(regu); 
	if (re.test(s)) 
	{ 
		return true; 
	}
	else
	{
		return false; 
	} 
} 

function isNull( str )
{ 
 if ( str == "" )

 return true; 

 var regu = "^[ ]+$"; 

 var re = new RegExp(regu); 

 return re.test(str); 
}
 
function checkform()
{	//验证快捷名称
	var getvalue= document.getElementById("map_name").value;
	
	if(isNull(trim(getvalue)))
	{
		document.getElementById("map_name_msg").innerHTML="<font class='terminal_star'><{$set_remote_map.enter_mapping_name|capitalize}></font>";
	
		document.getElementById("map_name").focus();
	
		return false;
	}
	else
	{
		if(!isChinaOrNumbOrLett(trim(getvalue)))
		{
			document.getElementById("map_name_msg").innerHTML="<font class='terminal_star'><{$set_remote_map.letter_number_Chinese|capitalize}></font>";
			document.getElementById("map_name").focus();
	
			return false;
		}
	}
	document.getElementById("map_name_msg").innerHTML="";
	//验证终端
	var getterminalid = trim(tree3.getAllChecked());

	var count = 0;

	var tempstore = new Array();

	var gettargetvalue = getterminalid.split(",");

	for(var i=0; i<gettargetvalue.length; i++)
	{
		if(isNumber(gettargetvalue[i]))
		{
			tempstore[count] = gettargetvalue[i];

			count++;

			if(count >1)
			{
				alert('<{$set_remote_map.selects|capitalize}>');
				return false;
			}
		}
		continue;
	}

	document.getElementById('task_map_id').value = trim(tempstore.toString());

	if(isNull(document.getElementById('task_map_id').value))
	{
		alert("<{$set_remote_map.select_task|capitalize}>");
		return false;
	}
}

function getoneinput(obj)
{
 	
		if(document.getElementById('map_name').value=="<{$set_remote_map.Please_Input|capitalize}>")
		{
			document.getElementById('map_name').value="";
		}


}

</script>

<script language="javascript">

var xmlhttp=null; 

function createXMLHttpRequest()
{ 
	if(window.ActiveXObject)
	{ 
		xmlhttp = new ActiveXObject("microsoft.XMLHTTP"); 
	} 
	else if(window.XMLHttpRequest)
	{ 
		xmlhttp = new XMLHttpRequest(); 
	}
	else
	{
		alert("NOT Support AJAX");
	}
} 
function get_remote_task_id(url)
{
   createXMLHttpRequest();

   xmlhttp.open( "get",url, true );

   xmlhttp.onreadystatechange = function()
   {
      if( xmlhttp.readyState == 4 )
      {
         if( xmlhttp.status == 200 )
         {
           var remote_task_id = xmlhttp.responseText;
		   
		  // alert(remote_task_id);
		   
		   refresh_tree_options(remote_task_id);
         }
      }
   }
	xmlhttp.setRequestHeader( "If-Modified-Since", "0");

	xmlhttp.send(null);
}

function get_load_remote_task_id()
{
	var str_url = "";
	
	var get_key_id = document.getElementById('keyvalue').value;
	
	str_url = "get_remote_key_id.php?key_id="+get_key_id+"";
	
	get_remote_task_id(str_url);
}

function get_change_remote_id(obj)
{
	var str_url = "";
	
	var get_key_id = obj.value;
	
	str_url = "get_remote_key_id.php?key_id="+get_key_id+"";
	
	get_remote_task_id(str_url);
}

function refresh_tree_options(task_id)
{
	var get_key_strid = tree3.getAllChecked();
	
	var get_key_array = get_key_strid.split(",");
	
	var get_key_id = "";
	
	for(var i=0; i<get_key_array.length; i++)
	{
		if(isNumber(get_key_array[i]))
		{
			get_key_id = get_key_array[i];
			
			break;
		}
	}
	
	if(get_key_id == "")
	{
		//什么也不做
	}
	else
	{
		tree3.setCheck(get_key_id,false);
	}

	tree3.setCheck(task_id,true);
}
</script>
