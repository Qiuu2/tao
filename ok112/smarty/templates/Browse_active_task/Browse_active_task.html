<script  language="javascript">



//获得选中文件的文件名
function getCheckboxItem()
{
	var allSel="";
	if(document.terminalfunctionplayform.id.checked)
	{
		allSel=document.terminalfunctionplayform.id.value;
		if(allSel==undefined)
		{
			allSel="";
		}
	}
	for(i=0;i<document.terminalfunctionplayform.id.length;i++)
	{
		if(document.terminalfunctionplayform.id[i].checked)
		{
			if(allSel=="")
				allSel=document.terminalfunctionplayform.id[i].value;
			else
				allSel=allSel+","+document.terminalfunctionplayform.id[i].value;
		}
	}
	return allSel;
}




function getdayofweek(str)
{
   var dayofweek="";
   var count = 0;
   for(i=0;i<str.length;i++)
   {
        if(str.charAt(i)=="1")
        {
			count++;
            switch(i)
            {
                case 0:
				dayofweek+="<{$Admmanager.Sunday}>";
                break;
                case 1:
				dayofweek+="<{$Admmanager.Monday}>";
                break;
                case 2:
				dayofweek+="<{$Admmanager.Tuesday}>";
                break;
                case 3:
				dayofweek+="<{$Admmanager.Wednesday}>";
                break;
                case 4:
				dayofweek+="<{$Admmanager.Thursday}>";
                break;
                case 5:
				dayofweek+="<{$Admmanager.Friday}>";
                break;
                case 6:
                dayofweek+="<{$Admmanager.Saturday}>";
                break;
				case 8:
				dayofweek+="<{$Admmanager.NextMonday}>";
                break;
				case 9:
				dayofweek+="<{$Admmanager.NextTuesday}>";
                break;
				case 10:
				dayofweek+="<{$Admmanager.NextWednesday}>";
                break;
				case 11:
				dayofweek+="<{$Admmanager.NextThursday}>";
                break;
				case 12:
				dayofweek+="<{$Admmanager.NextFriday}>";
                break;
				case 13:
				dayofweek+="<{$Admmanager.NextSaturday}>";
                break;
				case 14:
				dayofweek+="<{$Admmanager.NextSunday}>";
                break;
            }
        }
   }
   if(count>6)
   {
   		return "<{$terminal_function.every_day|capitalize}>";
   }
   return dayofweek;
}

function pause_curr_active_task(curr_active_task_id)
{
	window.location.href = "do.php?act=stop_curr_tast_state&taskid="+curr_active_task_id+"";
}

function start_curr_active_task(curr_active_task_id)
{

	window.location.href = "do.php?act=start_curr_tast_state&taskid="+curr_active_task_id+"";
}


function enordis_week_date_task(int_date)
{
 var getymd = "<{$get_ymd}>";
var qstr=getCheckboxItem();

if(qstr==null||qstr=="")
	{
		alert("<{$terminal_function.select_task|capitalize}>");
		
		return void(0);	
	}
	else
	{
			if(int_date=='0')
			{
			
				window.location.href = "do.php?act=enordis_date_task&get_str_date="+<{$get_str_date}>+"&get_int_date="+<{$get_int_date}>+"&en_dis=0&getdate="+getymd+"&id="+<{$getid}>+"&taskid="+qstr;
			}
			else if(int_date=='1')
			{	
				window.location.href = "do.php?act=enordis_date_task&get_str_date="+<{$get_str_date}>+"&get_int_date="+<{$get_int_date}>+"&en_dis=1&getdate="+getymd+"&id="+<{$getid}>+"&taskid="+qstr;
			}
	}
}
