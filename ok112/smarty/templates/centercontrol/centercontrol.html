<script>

function isNull( str )
{
	if ( str == "" || str==null) 
	return true;
	var regu = "^[ ]+$";
	var re = new RegExp(regu);
	return re.test(str);
}
function trim(str)
{
   str=str.replace(/(^\s*)|(\s*$)/g,""); 
   return str;
}

var xmlhttp=null; 
function createXMLHttpRequests()
{ 
	if(window.ActiveXObject)
	{ 
		xmlhttp = new ActiveXObject("microsoft.XMLHTTP"); 
	} 
	else if(window.XMLHttpRequest)
	{ 
		xmlhttp = new XMLHttpRequest(); 
	}
	else
	{
		alert('<{$alarm_setting.Not_support_AJAX|capitalize}>');
	}
} 
function getcentercontrolvalue(url)
{
   createXMLHttpRequests();
   var getresult="";
   xmlhttp.open( "get",url, false);
   xmlhttp.onreadystatechange = function()
   {
      if( xmlhttp.readyState == 4 )
      {
         if( xmlhttp.status == 200 )
         {
			getresult= trim(xmlhttp.responseText); 
         }
      }
   }
    xmlhttp.setRequestHeader( "If-Modified-Since", "0");
	xmlhttp.send(null);
	return getresult;
}


function postcentercontrolvalue(url)
{
   createXMLHttpRequests();
   var getresult="";
   xmlhttp.open( "get",url, false);
   xmlhttp.onreadystatechange = function()
   {
      if( xmlhttp.readyState == 4 )
      {
         if( xmlhttp.status == 200 )
         {
			getresult= trim(xmlhttp.responseText); 
         }
      }
   }
    xmlhttp.setRequestHeader( "If-Modified-Since", "0");
	xmlhttp.send(null);
	return getresult;
}


function setdevstate(obj)
{
	var url,getid,selected,gettext=0;
	var strs= new Array(); //定义一数组
	getid=obj.id; 
	
	if(obj.checked==true)
	selected=1;
	else if(obj.checked==false)
	selected=0;
	strs=getid.split("-"); //字符分割 	
	url ="centercontrolpost.php?device="+strs[1]+"&id="+strs[2]+"&selected="+selected;	
	
	gettext=postcentercontrolvalue(url);

	if(gettext==2)
	alert("<{$centercontrol.volume_max|capitalize}>");
	else if(getttext==3)
	alert("<{$centercontrol.volume_min|capitalize}>!");
	return gettext;

}

function  divcontrolupdatestate(id,systemstate,dormancy,projectionstate,pcstate,volstate,projectionscreenstate,volume,mix_preced,mic_vol,net_vol,showcase,notebook,computer,hdmi,power1,power2,netstate,flag)
{
	var divid;
	var inputs,inputbutton,dev,headstate;
	var i=1,m=0;
	if(flag==0)
	{
		divid="centerone-0-"+id;
	   if(netstate==1)
	   {
	  		headstate= document.getElementById(divid);
			headstate.style.background = '#5CACEE';
	   }
	   else
	   {
	 	  	headstate= document.getElementById(divid);
			headstate.style.background = '#8F8F8F';
	   }

		for(i=1;i<=15;i++)
		{
			if(i<6)
			{
				divid="centerone"+i+"-"+id;
				if(i==1)dev=systemstate;else if(i==2)dev=dormancy;else if(i==3)dev=projectionstate;else if(i==4)dev=pcstate;else if(i==5)dev=volstate;
				inputs=document.getElementById(divid).getElementsByTagName("input");
			}
			else if(i>=6&&i<=7)
			{
			  	inputs.length=0;
		
			}
			else if(i>7&&i<=14)
			{
				divid="centerone"+i+"-"+id;
				if(i==8)dev=showcase;else if(i==9)dev=notebook;else if(i==10)dev=computer;else if(i==11)dev=hdmi;else if(i==12)dev=power1;else if(i==13)dev=power2;else if(i==14)dev=mix_preced;
				inputs=document.getElementById(divid).getElementsByTagName("input");
			}
			for(var k = 0; k < inputs.length; k++) { 
					if (inputs[k].type == 'checkbox') { 
					 if(netstate==0)
					{
						inputs[k].disabled=true;
					}	
					else
					{
					if(<{$is_right}>==0)
					inputs[k].disabled=true;
					else
						inputs[k].disabled=false;
					}
					if(dev==1)
						inputs[k].checked=true;
					else
					{
						if(<{$is_right}>==0)
						inputs[k].disabled=true;
						else
							inputs[k].checked=false;
						}
					} 
				} 
		}
		for(var m=0;m<8;m++)
		{	
			if(m==0)
			divid="centerone-six-"+id;
			else if(m==1)
			divid="centerone-serven-"+id;
			else if(m==2)
			divid="centerone-eight-"+id;
			else if(m==3)
			divid="centerone-night-"+id;
			else if(m==4)
			divid="centerone-fourth-"+id;
			else if(m==5)
			divid="centerone-fiveth-"+id;
			else if(m==6)
			divid="centerone-sixth-"+id;
			else if(m==7)
			divid="centerone-serventh-"+id;
			
			
			
			inputbutton=document.getElementById(divid);
			 if(netstate==0)
				inputbutton.disabled=true;
			else
			{
			  inputbutton.disabled=false;
				
			}
		}
			
		
		
	}
}

function  divcontrolset(settext,num)
{
	var text;
	var divid,inputdiv;
	var i=0,j=0,k=0;
	var list =  JSON.parse(settext);//转换为json对象

	if(num==1)
		inputdiv=document.getElementById('wrap').getElementsByTagName('div');
	
	for(i=0;i<list.length;i++)
	{
		if(num==0)
		{	
			text=centercontroldiv(list[i].terminalid,list[i].terminalname);	
			$('#wrap').append(text);			
			divcontrolupdatestate(list[i].terminalid,list[i].systemstate,list[i].dormancy,list[i].projectionstate,list[i].pcstate,list[i].volstate,list[i].projectionscreenstate,list[i].volume,list[i].mix_preced,list[i].mic_vol,list[i].net_vol,list[i].showcase,list[i].notebook,list[i].computer,list[i].hdmi,list[i].power1,list[i].power2,list[i].netstate,num);		
			
		}
		else if(num==1)
		{
			j=0;
			for( k = 0; k < inputdiv.length; k++) { 
					divid="centerone"+list[i].terminalid;
					if(inputdiv[k].id==divid)
					{
						j=1;
						divcontrolupdatestate(list[i].terminalid,list[i].systemstate,list[i].dormancy,list[i].projectionstate,list[i].pcstate,list[i].volstate,list[i].projectionscreenstate,list[i].volume,list[i].mix_preced,list[i].mic_vol,list[i].net_vol,list[i].showcase,list[i].notebook,list[i].computer,list[i].hdmi,list[i].power1,list[i].power2,list[i].netstate,0);		
						break;
					}	
			}
			if(j==0)
			{
				text=centercontroldiv(list[i].terminalid,list[i].terminalname);	
				$('#wrap').append(text);
				divcontrolupdatestate(list[i].terminalid,list[i].systemstate,list[i].dormancy,list[i].projectionstate,list[i].pcstate,list[i].volstate,list[i].projectionscreenstate,list[i].volume,list[i].mix_preced,list[i].mic_vol,list[i].net_vol,list[i].showcase,list[i].notebook,list[i].computer,list[i].hdmi,list[i].power1,list[i].power2,list[i].netstate,num);	
			}
		}  
	}
	if(num==1)
	{
		for( k = inputdiv.length-1; k >=0; k--) 
		{ 
			if(inputdiv[k].className=="r-div")
			{
				j=0;
				for(i=0;i<list.length;i++)
				{
					divid="centerone"+list[i].terminalid;
					if(inputdiv[k].id==divid)
					{
						j=1;
						
						break;
					}
				}
				if(j==0)
				{
					temp="div#"+inputdiv[k].id;
					$(temp).remove();
				}
			}	
		}
	}
}

var searchtype="";
var searchvalue="";
function getcontroltext(num,flag)
{
 	var url;	
	url ="centercontrolget.php?flag="+flag+"&searchtype="+searchtype+"&searchvalue="+searchvalue;	

	var gettext=getcentercontrolvalue(url);
	
	divcontrolset(gettext,num);
	
	
	
	
	return gettext;
}

function checksearch()
{

	if(!isNull(document.getElementById('searchkey').value))
	{
		searchtype=document.getElementById('searchkey').value;
	
		searchvalue=document.getElementById('searchvalue').value;

		getcontroltext(1,0);  
	}
	else
	{
		searchtype="";
		searchvalue="";
		getcontroltext(1,0);  
	}

}


window.onload=function(){
 	getcontroltext(0,0);  
	self.setInterval("getcontroltext(1,0)",10000);//N毫秒刷新一次，1000毫秒＝1秒
}
