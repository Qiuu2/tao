<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>TerminalFunctionPlayManager</title>
<script src="skin/js/frame/sort_data_table.js" type="text/javascript"></script>
<link href="skin/css/main_page_style.css" rel="stylesheet" type="text/css" />

<script  language="javascript">
function addterterfuncplay()
{
	location="terminalfunctionplayadd.php";
}
function starttask()
{
	var getItem;
	
	getItem=getCheckboxItem();
	
	if(getItem==null||getItem=="")
	{
		alert("<{$terminal_function.select_broadcast_task|capitalize}>");
	}
	else
	{
		if(window.confirm("<{$terminal_function.Execute_Tasks}>"))
		{
			location="do.php?act=terfuncplaystart_msg&id="+getItem+"";
		}	
		else
		{
			return void(0);
		}
	}
}

function stoptask()
{
	var getItem;
	getItem=getCheckboxItem();
	if(getItem==null||getItem=="")
	{
		alert("<{$terminal_function.select_broadcast_task|capitalize}>");
	}
	else
	{
		if(window.confirm("<{$terminal_function.suspending_task|capitalize}>"))
		{
			location="do.php?act=terfuncplaystop_msg&id="+getItem+"";
		}
		else
		{
			return void(0);
		}
	}
}

function modifytask()
{
	var getItem;
	getItem=getCheckboxItem();
	var count=0;
	for(var i=0;i<document.terminalfunctionplayform.id.length;i++)
	{
		if(document.terminalfunctionplayform.id[i].checked)
		{
			count++;
			if(count>=2)
			{
				alert('<{$terminal_function.only_select_one|capitalize}>');
				return void(0);
			}
		}
	}
	if(getItem==null||getItem=="")
	{
		alert("<{$terminal_function.select_broadcast_task|capitalize}>");
		return void(0);
	}
	else
	{
		location="centerctrlmodify.php?id="+getItem+"";	
	}
}

function deltask()
{
	var getItem = "";
	
	getItem = getCheckboxItem();
	
	if(getItem==null||getItem=="")
	{
		alert("<{$terminal_function.select_broadcast_task|capitalize}>");
		return void(0);
	}
	else
	{
		if(window.confirm("<{$terminal_function.confirm_deleting|capitalize}>"))
		{
			location="do.php?act=centerctrdel_msg&id="+getItem+"";
		}
		else
		{
			return void(0);
		}
	}
}

//获得选中文件的文件名
function getCheckboxItem()
{
	var allSel="";
	if(document.terminalfunctionplayform.id.checked)
	{
		allSel=document.terminalfunctionplayform.id.value;
		if(allSel==undefined)
		allSel="";
	}
	for(i=0;i<document.terminalfunctionplayform.id.length;i++)
	{
		if(document.terminalfunctionplayform.id[i].checked)
		{
			if(allSel=="")
				{
					allSel=document.terminalfunctionplayform.id[i].value;
				}
			else
				{
					allSel=allSel+","+document.terminalfunctionplayform.id[i].value;
				}	
		}
	}
	return allSel;
}

function selAll(aid)
{
	if(aid==0)
	{
		document.terminalfunctionplayform.id.checked=true;
	}
	for(i=0;i<document.terminalfunctionplayform.id.length;i++)
	{
		if(!document.terminalfunctionplayform.id[i].checked)
		{
			document.terminalfunctionplayform.id[i].checked=true;
		}
	}
}
function noSelAll(aid)
{
	if(aid==0)
	{
		document.terminalfunctionplayform.id.checked=false;
	}
	for(i=0;i<document.terminalfunctionplayform.id.length;i++)
	{
		if(document.terminalfunctionplayform.id[i].checked)
		{
			document.terminalfunctionplayform.id[i].checked=false;
		}
	}
}
function set_task_volume()
{
	var task_id = getCheckboxItem();
	if(navigator.appName.indexOf("Explorer") > -1)        
	 var volume_value = document.getElementById('d1').innerText;
	 else
	 var volume_value = document.getElementById('d1').textContent;

	ajax_set_task_volume("2",volume_value,task_id);
}
function disappear_volume_div()
{
	if(document.getElementById('change_volume').style.display == "block")
	{
		document.getElementById('change_volume').style.display = "none";
	}
}
function getdayofweek(str)
{
   var dayofweek="";
   var count = 0;
   for(i=0;i<str.length;i++)
   {
        if(str.charAt(i)=="1")
        {
			count++;
            switch(i)
            {
                case 0:
				dayofweek+="<{$Admmanager.Sunday}>";
                break;
                case 1:
				dayofweek+="<{$Admmanager.Monday}>";
                break;
                case 2:
				dayofweek+="<{$Admmanager.Tuesday}>";
                break;
                case 3:
				dayofweek+="<{$Admmanager.Wednesday}>";
                break;
                case 4:
				dayofweek+="<{$Admmanager.Thursday}>";
                break;
                case 5:
				dayofweek+="<{$Admmanager.Friday}>";
                break;
                case 6:
                dayofweek+="<{$Admmanager.Saturday}>";
                break;
            }
        }
   }
   if(count==7)
   {
   		return "<{$terminal_function.every_day|capitalize}>";
   }
   return dayofweek;
}
</script>
