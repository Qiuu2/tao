<SCRIPT language="javascript" defer="true">
function isNumber( s )
{ 
	var regu = "^[0-9]+$"; 
	var re = new RegExp(regu); 
	if (s.search(re) != -1) 
	{ 
		return true; 
	}
	else 
	{ 
		return false; 
	} 
} 
function trim(str)
{
   str=str.replace(/(^\s*)|(\s*$)/g,""); 
   return str;
}
function isNull( str )
{
	if ( str == "" || str==null) 
	return true;
	var regu = "^[ ]+$";
	var re = new RegExp(regu);
	return re.test(str);
}
function isChinaOrNumbOrLett(s)
{
	var regu = "^[0-9a-zA-Z\u4e00-\u9fa5]+$"; 
	var re = new RegExp(regu); 
	if (re.test(s)) 
	{ 
		return true; 
	}
	else
	{ 
		return false; 
	} 
} 
var sounds_tree_terminal_string = new Array();
var sounds_tree_device_string = new Array();
function sounds_tree_terminal_group_string(string_array)
{
	var string_arrays = string_array.split(",");
	for(var i=0; i<string_arrays.length; i++)
	{
		if(string_arrays[i].indexOf("::") != -1)
		{
			var string_arrays_temp = string_arrays[i].split("::");
			if(string_arrays_temp[0]=="stream")
			{
			sounds_tree_terminal_string.push(string_arrays_temp[1]);
			}
			else if(string_arrays_temp[0]=="sounds")
			{
			sounds_tree_device_string.push(string_arrays_temp[1]);
			}
			else
			{
				return false;
			}
		}
	}
	return true; 
}
function checkform()
{	
	//验证组名
	if(isNull(trim(document.getElementById('streamname').value)))
	{
		document.getElementById('streamname_s').innerHTML="<font class='terminal_star'><{$stream_create.Zoning_name|capitalize}></font>";
		document.getElementById('streamname').focus();
		return false;
	}
	else
	{
		if(!isChinaOrNumbOrLett(trim(document.getElementById('streamname').value)))
		{
			document.getElementById('streamname_s').innerHTML="<font class='terminal_star'><{$stream_create.letter_number_Chinese|capitalize}></font>";
			document.getElementById('streamname').focus();
			return false;
		}
	}
	document.getElementById('streamname_s').innerHTML="<font class='terminal_star'></font>";
	//验证媒体文件是否为空
	var str=trim(tree2.getAllChecked());
	
	var temp=0;

	if(false==sounds_tree_terminal_group_string(str))
	{
		alert('<{$stream_create.selected_sounddevice|capitalize}>');
		return false;
	}

	document.getElementById('nostreamterminal').value=trim(sounds_tree_terminal_string.toString());	
	document.getElementById('nosoundsdevice').value=trim(sounds_tree_device_string.toString());	
	

	if(isNull(document.getElementById('nosoundsdevice').value))
	{
		alert('<{$stream_create.devicenonull|capitalize}>');
		return false;
	}
	

	if(isNull(document.getElementById('nostreamterminal').value))
	{
		/*if(window.confirm('<{$stream_create.terminal_or_not|capitalize}>'))
		{
			return false;
		}
		else
		{
			return true;
		}
		*/
		alert('<{$stream_create.Select_Terminal|capitalize}>');
		return false;	
	}

}
