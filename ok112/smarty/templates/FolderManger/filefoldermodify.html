<script language="javascript"> 
function isNull( str )
{
	if ( str == "" || str==null) 
	return true;
	var regu = "^[ ]+$";
	var re = new RegExp(regu);
	return re.test(str);
}
function isChinaOrNumbOrLett(s)
{ 
	var regu = "^[0-9a-zA-Z\u4e00-\u9fa5]+$"; 
	var re = new RegExp(regu); 
	if (re.test(s)) 
	{ 
		return true; 
	}
	else
	{ 
		return false; 
	} 
} 
function checkform()
{
	if(isNull(document.fileForm.folderName.value))
	{
		document.getElementById('folderName_s').innerHTML="<font class='terminal_star'><{$modify_folder.enter_name|capitalize}></font>";
		document.fileForm.folderName.focus();
		return false;
	}
	else
	{
		if(!isChinaOrNumbOrLett(document.fileForm.folderName.value))
		{
			document.getElementById('folderName_s').innerHTML="<font class='terminal_star'><{$modify_folder.letter_number_Chinese|capitalize}></font>";
			document.fileForm.folderName.focus();
			return false;
		}
	}

	}
	
	document.getElementById('folderName_s').innerHTML="<font class='terminal_star'></font>";*/

}
function chinese_big5_english(curr_language,txt_msg)

            case "录音媒体库":

			case "语音合成媒体库":

        }
    }
return txt_msg;
}
