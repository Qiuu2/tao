<script type="text/javascript">
function isNull( str )
{
	if ( str == "" || str==null) 
	return true;
	var regu = "^[ ]+$";
	var re = new RegExp(regu);
	return re.test(str);
}

function delfolder()
{
	var qstr=getCheckboxItem();
	if(qstr==null||qstr=="")
	{
		alert("<{$file_folder_manager.select_folder|capitalize}>");
		return void(0);	
	}
	else
	{
		if(!window.confirm("<{$file_folder_manager.confirm_deleting|capitalize}>"))
		{
			return void(0);
		}	
		else
		{
			location="do.php?act=folderdel_msg&id="+qstr+"";
		}
	}
}

function modifyfolder()
{
	var get_folder_id = "";
	get_folder_id = getOneItem();
	if(isNull(get_folder_id))
	{
		alert("<{$file_folder_manager.select_folder|capitalize}>");
		return void(0);
	}
	else
	{
		var array_id = get_folder_id.split(",");
		if(array_id.length > 1)
		{
			alert("<{$file_folder_manager.select_one|capitalize}>");
			return void(0);
		}
		else if(array_id.length == 1)
		{
			window.location.href="filefoldermodiry.php?id="+get_folder_id+"";
		}
	}
}
//获得选中文件的文件名
function getCheckboxItem()
{
	var allSel="";
	if(document.form2.id.checked)
	{
		allSel=document.form2.id.value;
		if(allSel==undefined)
		{
			allSel="";
		}
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			if(allSel=="")
				allSel=document.form2.id[i].value;
			else
				allSel=allSel+","+document.form2.id[i].value;
		}
	}
	return allSel;
}

function getOneItem()
{
	var folder_id = "";
	
	var obj = document.getElementsByName('id');
	
	for(var i= 0; i<obj.length; i++ )
	{
		if(obj[i].checked == true)
		{
			if(isNull(folder_id))
			{
				folder_id = obj[i].value;
			}
			else
			{
				folder_id +=","+obj[i].value;
			}
		}
	}
	return folder_id;
}

function selAll(aid)
{
	if(aid==0)
	{
		document.form2.id.checked=true;
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(!document.form2.id[i].checked)
		{
			document.form2.id[i].checked=true;
		}
	}
}
function noSelAll(aid)
{
	if(aid==0)
	{
		document.form2.id.checked=false;
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			document.form2.id[i].checked=false;
		}
	}
}

function addfolder()
{
	var get_folder_id = "";
	
	get_folder_id = getOneItem();//过滤--保证选择唯一个
	
	window.location.href="filefolderadd.php?id="+get_folder_id+"";
}

return txt_msg;
