<script language="JavaScript" src="smarty/templates/BellManager/codebase/dhtmlxcommon.js" type"text/JavaScript"></script>
	
<script type="text/javascript">
function isNumber(s)
{ 
	var regu = "^[0-9]+$"; 
	var re = new RegExp(regu); 
	if (s.search(re) != -1) 
	{ 
		 return true; 
	} 
	else 
	{ 
		 return false; 
	} 
}
function isNull( str )
{
   if ( str == "" )
   return true;
   var regu = "^[ ]+$";
   var re = new RegExp(regu);
   return re.test(str);
}
function isChinaOrNumbOrLett(s)
{
	var regu = "^[0-9a-zA-Z\u4e00-\u9fa5]+$"; 
	var re = new RegExp(regu); 
	if (re.test(s)) 
	{ 
		return true; 
	}
	else
	{ 
		return false; 
	} 
} 

function trim(str)
{
   str=str.replace(/(^\s*)|(\s*$)/g,""); 
   return str;
}

function checkform()
{
	//验证分区名称
	if( isNull(document.getElementById('streamname').value) )
	{
		document.getElementById('streamname').focus();
		document.getElementById('streamname_text').innerHTML = "<font class='terminal_star'><{$stream_modify.Zoning_name|capitalize}></font>";
		return false;
	}
	else
	{
		if(!isChinaOrNumbOrLett(trim(document.getElementById('streamname').value)))
		{
			document.getElementById('streamname_text').innerHTML = "<font class='terminal_star'><{$stream_modify.letter_number_Chinese|capitalize}></font>";
			document.getElementById('streamname').focus();
			return false;
		}
	}
	document.getElementById('streamname_text').innerHTML = "<font></font>";
	
	//验证终端
	var str=tree3.getAllChecked();
	var strarray=str.split(",");
	var temp=0;
	var storearray=new Array();
	for(var i=0;i<strarray.length;i++)
	{
		if(isNumber(strarray[i]))
		{
			storearray[temp]=strarray[i];
			temp++;
		}
		continue;
	}
	document.getElementById('selectedterminal').value=trim(storearray.toString());
	if(isNull(document.getElementById('selectedterminal').value))
	{
		if(window.confirm('<{$stream_modify.terminal_or_not|capitalize}>'))
		{
			return false;
		}
		else
		{
			return true;
		}
	}
}
</script>
