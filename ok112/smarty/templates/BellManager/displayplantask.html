<script  language="javascript">

function getdayofweek(str)
{
   var dayofweek="";
   var count = 0;
   for(i=0;i<str.length;i++)
   {
        if(str.charAt(i)=="1")
        {
			count++;
            switch(i)
            {
                case 0:
                dayofweek+="<{$Bellmanager.Sunday}>&nbsp;";
                break;
                case 1:
				dayofweek+="<{$Bellmanager.Monday}>&nbsp;";
                break;
                case 2:
				dayofweek+="<{$Bellmanager.Tuesday}>&nbsp;";
                break;
                case 3:
				dayofweek+="<{$Bellmanager.Wednesday}>&nbsp;";
                break;
                case 4:
				dayofweek+="<{$Bellmanager.Thursday}>&nbsp;";
                break;
                case 5:
				dayofweek+="<{$Bellmanager.Friday}>&nbsp;";
                break;
                case 6:
				dayofweek+="<{$Bellmanager.Saturday}>&nbsp;";
                break;
                  
            }
        }
   }
   if(count==7)
   {
   		return "<{$Bellmanager.Every_day}>";
   }
 return dayofweek;
}

{

}
