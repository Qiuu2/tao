<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>UserGroupManager</title>

<link href="skin/css/main_page_style.css" rel="stylesheet" type="text/css" />

<script type="text/javascript">
function getCheckboxItem()
{
	var allSel="";
	if(document.form2.id.checked) 
	{
		allSel=document.form2.id.value;
		if(allSel==undefined)
		{
			allSel="";
		}
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			if(allSel=="")
				allSel=document.form2.id[i].value;
			else
				allSel=allSel+","+document.form2.id[i].value;
		}
	}
	return allSel;
}

function getOneItem()
{
	var allSel="";
	var count=0;
	if(document.form2.id.checked) 
	{
		allSel=document.form2.id.value;
		if(allSel==undefined)
		{
			allSel="";
		}
	}
	for(var i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			count++;
			if(count>=2)
			{
				alert('<{$user_group_manager.only_select_one|capitalize}>');
				return void(0);
			}
		}
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			allSel = document.form2.id[i].value;
			break;
		}
	}
	if(allSel=="")
	{
		alert("<{$user_group_manager.select_user_groups|capitalize}>");
		return void(0);
	}
	return allSel;
}

function selAll(aid)
{
	if(aid==0) 
	{
		document.form2.id.checked=true;
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(!document.form2.id[i].checked)
		{
			document.form2.id[i].checked=true;
		}
	}
}
function noSelAll(aid)
{
	if(aid==0) 
	{
		document.form2.id.checked=false;
	}
	
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			document.form2.id[i].checked=false;
		}
	}
}

function delUserGroup()
{
	var qstr=getCheckboxItem();
	
	if(qstr==null||qstr=="")
	{
		alert("<{$user_group_manager.select_user_groups|capitalize}>");
		return void(0);	
	}
	else
	{
		if(!window.confirm("<{$user_group_manager.confirm_deleting|capitalize}>"))
		{
				return void(0);
		}	
		else
		{
				location="do.php?act=usergroupdel_msg&id="+qstr+"";
		}
	}
}
function modifyusergroup()
{
	var getgroupid=getOneItem();
	if(getgroupid==undefined)
	{
		getgroupid="";
	}
	if(getgroupid=="")
	{
		alert("<{$user_group_manager.select_user_groups|capitalize}>");
		return void(0);
	}
	else
	{	
		window.location.href="usergroupedit.php?id="+getgroupid+"";	
	}
}
</script>
</head>

<body>
<{include file="UserGroupManager/usergroupmanager_form.html"}> 
<{include file="language/`$language`_foot.php"}> 
</body>
</html>
