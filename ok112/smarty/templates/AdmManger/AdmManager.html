<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>AdmManager</title>
<script src="skin/js/frame/sort_data_table.js" type="text/javascript"></script>
<link href="skin/css/main_page_style.css" rel="stylesheet" type="text/css" />
<style>
 
	/* 奇数行样式 */
	tr:nth-child(odd) {
		background-color: #ffffff;
	}
	
	/* 偶数行样式 */
	tr:nth-child(even) {
		background-color: #c1cfe0;
	}
</style>
<script language="javascript">
function addTask()
{
	window.location.href="admaddtask.php";
}

function modifyAdmTask()
{
	var getItem=getCheckboxItem();
	var count=0;
	for(i=0;i<document.fileAdvForm.id.length;i++)
	{
		if(document.fileAdvForm.id[i].checked)
		{
			count++;
			if(count>=2)
			{
				alert("<{$collect_manager.only_select_one|capitalize}>");
				return void(0);
			}
		}
	}
	if(getItem==null||getItem=="")
	{
		alert("<{$collect_manager.select_broadcast_task|capitalize}>");
		return void(0);
	}
	else
	{
		window.location.href="admmodify.php?id="+getItem+"";
	}
}
function startTask(){
	var getItem;
	getItem=getCheckboxItem();
	if(getItem==null||getItem=="")
	{
		window.alert("<{$collect_manager.select_broadcast_task|capitalize}>");
		return void(0);
	}
	else
	{
		window.location.href="do.php?act=admtaskstart_msg&id="+getItem+"";
	}
}

function delTask()
{
	var getItem = getCheckboxItem();
	
	if(getItem==null||getItem=="")
	{
		alert("<{$collect_manager.select_broadcast_task|capitalize}>");
		return void(0);
	}
	else
	{
		if(confirm("<{$collect_manager.confirm_deleting|capitalize}>"))
		{
			window.location.href="do.php?act=admtaskdel_msg&id="+getItem+"";
		}
		else
		{
			return void(0);
		}
	}
}
function stopTask()
{
	var getItem=getCheckboxItem();
	if(getItem==null||getItem=="")
	{
		alert("<{$collect_manager.select_broadcast_task|capitalize}>");
		return void(0);
	}
	else
	{
		if(window.confirm("<{$collect_manager.suspending_task|capitalize}>"))
		{
			window.location.href="do.php?act=admtaskstop_msg&id="+getItem+"";
		}
		else
		{
			return void(0);
		}
	}
}

function getCheckboxItem()
{
	var allSel="";
	if(document.fileAdvForm.id.checked)
	{
		allSel=document.fileAdvForm.id.value;
		if(allSel==undefined)
		{
			allSel="";
		}
	}
	for(i=0;i<document.fileAdvForm.id.length;i++)
	{
		if(document.fileAdvForm.id[i].checked)
		{
			if(allSel=="")
				allSel=document.fileAdvForm.id[i].value;
			else
				allSel=allSel+","+document.fileAdvForm.id[i].value;
		}
	}
	return allSel;
}

function selAll(aid)
{
	if(aid==0)
	{
		document.fileAdvForm.id.checked=true;
	}
	for(i=0;i<document.fileAdvForm.id.length;i++)
	{
		if(!document.fileAdvForm.id[i].checked)
		{
			document.fileAdvForm.id[i].checked=true;
		}
	}
}//全选
function noSelAll(aid)
{
	if(aid==0)
	{
		document.fileAdvForm.id.checked=false;
	}
	for(i=0;i<document.fileAdvForm.id.length;i++)
	{
		if(document.fileAdvForm.id[i].checked)
		{
			document.fileAdvForm.id[i].checked=false;
		}
	}
}

function getdayofweek(str)
{
   var dayofweek="";
   var count = 0;
   for(i=0;i<str.length;i++)
   {
        if(str.charAt(i)=="1")
        {
			count++;
            switch(i)
            {
                case 0:
				dayofweek+="<{$Admmanager.Sunday}>";
                break;
                case 1:
				dayofweek+="<{$Admmanager.Monday}>";
                break;
                case 2:
				dayofweek+="<{$Admmanager.Tuesday}>";
                break;
                case 3:
				dayofweek+="<{$Admmanager.Wednesday}>";
                break;
                case 4:
				dayofweek+="<{$Admmanager.Thursday}>";
                break;
                case 5:
				dayofweek+="<{$Admmanager.Friday}>";
                break;
                case 6:
                dayofweek+="<{$Admmanager.Saturday}>";
                break;
            }
        }
   }
   if(count==7)
   {
   		return "<{$collect_manager.every_day|capitalize}>";
   }
   return dayofweek;
}

function set_task_volume()
{
	var task_id = getCheckboxItem();
	//var volume_value = trim(document.getElementById('d1').innerHTML);
	if(navigator.appName.indexOf("Explorer") > -1)        
	 var volume_value = document.getElementById('d1').innerText;
	 else
	 var volume_value = document.getElementById('d1').textContent;
	ajax_set_task_volume("3",volume_value,task_id);
}
function disappear_volume_div()
{
	if(document.getElementById('change_volume').style.display == "block")
	{
		document.getElementById('change_volume').style.display = "none";
	}
}
/******************
	启用广播
******************/
function enableTask()
{
	var getid=getCheckboxItem();

	if(getid==null)
	{
		alert("<{$collect_manager.select_broadcast_task|capitalize}>");
		return void(0);	
	}
	else
	{
		if(window.confirm("<{$collect_manager.enterenable|capitalize}>"))
		{
			window.location.href ="do.php?act=enableTask&id="+getid+"";
		}
		else
		{
			return void(0);
		}
	}	
}
/*****************
	停用广播
*****************/
function disableTask()
{
	var getid=getCheckboxItem();
	if(getid==null)
	{
		alert("<{$collect_manager.select_broadcast_task|capitalize}>");
		return void(0);	
	}
	else
	{	
		if(window.confirm("<{$collect_manager.enterdisable|capitalize}>"))
		{
			window.location.href = "do.php?act=disableTask&id="+getid+"";
		}
		else
		{
			return void(0);
		}
	}
}

</script>
</head>
<body>
  <{include file="AdmManger/AdmManger_form.html"}>
  <{include file="language/`$language`_foot.php"}>
</body>
</html>
