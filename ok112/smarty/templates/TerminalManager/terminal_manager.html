function delterminal(aid)
{
	var del_terminal_count = 0;
	
	var qstr=getCheckboxItem();
	
	if(qstr==null||qstr=="")
	{
		alert("<{$terminal_manager.select_terminal|capitalize}>");
		
		return void(0);	
	}
	else
	{
		for(; del_terminal_count<5; del_terminal_count++)
		{
			if( window.confirm("<{$terminal_manager.Determine_remove|capitalize}>"+(del_terminal_count+1)+"<{$terminal_manager.Times}>" ) )
			{
				if(del_terminal_count == 4)
				{
					location="do.php?act=terminaldel_msg&id="+qstr+"";
				}
			}
			else
			{
				return void(0);
			}
		}
	}
}
function getCheckboxItem()
{
	var allSel="";
	
	if(document.form2.id.checked)
	{
		allSel=document.form2.id.value;
	
		if(allSel==undefined)
	
		allSel="";
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			if(allSel=="")
			
				allSel=document.form2.id[i].value;
				
			else
			
				allSel=allSel+","+document.form2.id[i].value;
		}
	}
	return allSel;
}

function selAll(aid)
{
	if(aid==0)
	{
		document.form2.id.checked=true;
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(!document.form2.id[i].checked)
		{
			document.form2.id[i].checked=true;
		}
	}
}
function noSelAll(aid)
{
	if(aid==0)
	{
		document.form2.id.checked=false;
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			document.form2.id[i].checked=false;
		}
	}
}

function setshotcut()
{
	var getterminalid = getCheckboxItem();

	if(isNull(getterminalid))
	{
		alert("<{$terminal_manager.select_terminal|capitalize}>");
		
		return void(0);
	}
	else
	{
		var temp = getterminalid.split(",");
		
		if(temp.length > 1)
		{
			alert('<{$terminal_manager.Only_select_one|capitalize}>');
			
			return void(0);
		}
		else if(temp.length == 1)
		{
			window.location.href = "setterminalkeyoption.php?id="+getterminalid+"";
		}
	}
}

function view_shotcut()
{
	var obj_arr = document.getElementsByName('id');
	
	var count = 0;
	
	var terminal_id = "";
	
    for (var i=0; i<obj_arr.length; i++)
    {

		if(obj_arr[i].checked  == true)
		{
			count ++;
			
			terminal_id = obj_arr[i].value;
		}
    }
	if(count > 1 || count < 1)
	{
		alert('<{$terminal_manager.Only_select_one|capitalize}>');
		
		return void(0);
	}
	if(count == 1)
	{
		window.location.href = "view_terminal_shotcut_mapping.php?terminal_id="+terminal_id+"";
	}
}

function cancel_shotcut()
{
	var obj_arr = document.getElementsByName('id');
	
	var count = 0;
	
	var terminal_id = "";
	
    for (var i=0; i<obj_arr.length; i++)
    {
		if(obj_arr[i].checked  == true)
		{
			count ++;
			
			terminal_id = obj_arr[i].value;
		}
    }
	if(count > 1 || count < 1)
	{
		alert('<{$terminal_manager.Only_select_one|capitalize}>');
		
		return void(0);
	}
	else
	{
		if(window.confirm('<{$terminal_manager.Determine_remove|capitalize}>'))
		{
			window.location.href = "do.php?act=cancel_terminal_shotcut&terminal_id="+terminal_id+"";
		}
		else
		{
			return void(0);
		}
	}
}

function setupDiv()
{
	var get_terminal_id = getCheckboxItem();

	var get_terminal_password = "";
	
	if(isNull(get_terminal_id))
	{
		alert("<{$terminal_manager.select_terminal|capitalize}>");
		
		return void(0);
	}
	
	get_terminal_password = trim(document.getElementById('terminal_password').value);
	
	if(isNull(get_terminal_password))
	{
		document.getElementById('terminal_password_msg').innerHTML = "<{$terminal_manager.Input_errors}>";
	
		return void(0);
	}
	else
	{
		if(isNumber(get_terminal_password))
		{
			if(get_terminal_password.length<6 || get_terminal_password.length > 15)
			{
				document.getElementById('terminal_password_msg').innerHTML = "<{$terminal_manager.Input_errors}>";
			
				return void(0);
			}
			else
			{
				document.getElementById('terminal_password_msg').innerHTML = "<{$terminal_manager.Input_valid}>";
				
				document.getElementById('terminal_password_msg').style.color = "#00FF00";
				
				window.location.href = "set_terminal_password.php?terminal_id="+get_terminal_id+"&terminal_password="+get_terminal_password+"";
			}
		}
		else
		{
			document.getElementById('terminal_password_msg').innerHTML = "<{$terminal_manager.Input_errors}>";
			
			return void(0);
		}
	}
}
