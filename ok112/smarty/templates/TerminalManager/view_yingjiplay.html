<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>view_terminal_shotcut</title>
<link href="skin/css/main_page_style.css" rel="stylesheet" type="text/css"/>
<style>
 
	/* 奇数行样式 */
	tr:nth-child(odd) {
		background-color: #ffffff;
	}
	
	/* 偶数行样式 */
	tr:nth-child(even) {
		background-color: #c1cfe0;
	}
</style>
<script type="text/javascript">
function getCheckboxItem()
{
	var allSel="";
	if(document.form2.id.checked)
	{
		allSel=document.form2.id.value;
		if(allSel==undefined)
		allSel="";
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			if(allSel=="")
				allSel=document.form2.id[i].value;
			else			
				allSel=allSel+","+document.form2.id[i].value;
		}
	}
	return allSel;
}


function selAll(aid)
{
	if(aid==0)
	{
		document.form2.id.checked=true;
	}
	
	for(i=0;i<document.form2.id.length;i++)
	{
		if(!document.form2.id[i].checked)
		{
			document.form2.id[i].checked=true;
		}
	}
}
function noSelAll(aid)
{
	if(aid==0)
	{
		document.form2.id.checked=false;
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			document.form2.id[i].checked=false;
		}
	}
}

function view_terminal(str)
{
	window.location.href = "displayterminal.php?key_id="+str+"";
}

function setshotcut(flag)
{
	var getterminalid = <{$terminal_id}>;
	if(flag==1)
	{
		window.location.href = "setyingjiplay.php?id="+getterminalid+"";
	}
	else if(flag==2)
	{
		var getid=getCheckboxItem();
		var count=0;
		var i=0;
		for(i=0;i<document.form2.id.length;i++)
		{
			if(document.form2.id[i].checked)
			{
				count++;
				if(count>=2)
				{
					alert("<{$terminal_manager.Only_select_one|capitalize}>");
					return void(0);
				}
			}
		}
		if(getid==""||getid==null)
		{
			alert("<{$terminal_manager.select_task|capitalize}>");
		}
		else
		{
			window.location.href = "modifyyingjiplay.php?id="+getterminalid+"&getid="+getid+"";
		}
	}
	else if(flag==3)
	{
		var getid=getCheckboxItem();
		if(getid==""||getid==null)
		{
			alert("<{$terminal_manager.select_task|capitalize}>");
		}
		else
		{
		 	window.location.href = "do.php?getid="+getid+"";
		}
	}
}
	function convert(value, dataType) 
	{

		switch(dataType) 
		{
			case "int":
				return parseInt(value);
				break
			case "float":
				return parseFloat(value);
				break
			case "date":
				return Date.parse(value);
				break
			default:
				return value.toString();
		}
	}
	//sortȽַ
	function compareCols(col, dataType) 
	{
		return function compareTrs(tr1, tr2) 
		{
			value1 = convert(tr1.cells[col].innerHTML, dataType);
			value2 = convert(tr2.cells[col].innerHTML, dataType);
			if (value1 < value2) 
			{
				return -1;
			} 
			else if (value1 > value2) 
			{
		
				return 1;
			} 
			else 
			{
				return 0;
			}
		};
	}

	function sortTable(tableId, col, dataType) 
	{
		var table = document.getElementById(tableId);
		var tbody = table.tBodies[0];
		var tr = tbody.rows; 
		var trValue = new Array();

		for (var i=0; i<tr.length; i++ ) 
		{
			trValue[i] = tr[i];  //иеϢ洢½
		}

		if ((tbody.sortCol == col)&&(dataType=='1')) 
		{
			trValue.reverse(); //ѾˣֱӶ䷴
		} 
		else 
		{
			trValue.sort(compareCols(col, dataType));  //
		}
	
		var fragment = document.createDocumentFragment();  //½һƬΣڱĽ
		for (var i=0; i<trValue.length; i++ ) 
		{
			fragment.appendChild(trValue[i]);
		}
		tbody.appendChild(fragment); //Ľ滻֮ǰֵ
		tbody.sortCol = col;
	}

function del_terminal_shotcut()
{
	var terminal_id = <{$terminal_id}>;
		var getid=getCheckboxItem();
		if(getid==""||getid==null)
		{
			alert("<{$terminal_manager.select_task|capitalize}>");
		}
	else
	{
		if(!window.confirm("<{$terminal_manager.Determine_remove|capitalize}>"))
		{
			return void(0);
		}
		else
		{
			window.location.href = "do.php?act=del_yingjiplay&id="+getid+"&terminal_id="+terminal_id+"";
		}
	}
}
</script>
</head>
<body>

</body>
