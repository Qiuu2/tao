<link href="skin/css/main_page_style.css" rel="stylesheet" type="text/css"/>
<style>
 
	/* 奇数行样式 */
	tr:nth-child(odd) {
		background-color: #ffffff;
	}
	
	/* 偶数行样式 */
	tr:nth-child(even) {
		background-color: #c1cfe0;
	}
</style>
<script type="text/javascript">
function view_terminal(str)
{
	window.location.href = "displayterminal.php?key_id="+str+"";
}
function setshotcut()
{
	var getterminalid = <{$terminal_id}>;
	

			window.location.href = "set_terminal_call_mapping.php?id="+getterminalid+"";
			

}
function lookshotcut()
{
	var getterminalid = <{$terminal_id}>;
	

			window.location.href = "view_terminal_call_group.php?id="+getterminalid+"";

}
function del_terminal_shotcut(str)
{
	if(window.confirm("<{$Termianl_manager_del}>"))
	{
		window.location.href = "do.php?act=del_terminal_shotcut&id="+str+"";
	}
	else
	{
		return void(0);
	}
}
</script>
