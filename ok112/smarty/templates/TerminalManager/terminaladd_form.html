<link href="../../../skin/css/skinstyle.css" rel="stylesheet" type="text/css" />

<table class="add" width="780" border="0" align="center" cellpadding="0" cellspacing="10">
  <tr>
    <td><form name="formtmadd" method="post" action="do.php?act=terminaladd_msg" onSubmit="return checkform()">
      <table class="colors" width="100%" border="0" cellpadding="5" cellspacing="1">
        <tr>
          <td colspan="3"><img src="images/gif_47_040.gif" width="48" height="48"><img src="images/tjzd.gif" width="100" height="48"><a name="form"></a></td>
        </tr>
        <tr>
          <td width="18%" align="right"><strong>广播区域</strong></td>
          <td width="68%">
          	<select class="colors" name=streamid>
          	<{section name=streamid loop=$stream}>
          	<option value="<{$stream[streamid].streamid}>">  <{$stream[streamid].name}> 
          	<{/section}> 
				    </select>        
          <td width="14%">&nbsp;</td>
        </tr>         
        <tr>
          <td width="18%" align="right"><strong>终端名</strong></td>
          <td width="68%">
          	<input class="colors" name="terminalname" type="text" id="terminalname" value="">
          	<span id="terminalname_s"><font class="prompt">*名称只能由数字 字母 中文组成</font></span>          </td>
          <td width="14%">&nbsp;</td>
        </tr>        
        <tr>
          <td width="18%" align="right"><strong>终端类型</strong></td>
          <td width="68%">
         	<select class="colors" name=typeid>
        	<{section name=typeid loop=$terminaltype}>
        	<option value="<{$terminaltype[typeid].id}>"><{$terminaltype[typeid].name}> 
        	<{/section}> 
			    </select>        
          <td width="14%">&nbsp;</td>
        </tr>      
        <tr>
          <td width="18%" align="right"><strong>ip</strong></td>
          <td width="68%"><input class="colors" name="ip" type="text" id="ip" value=""><span id="ip_s"><font class="prompt">*(如：192.168.1.1)</font></span></td>
          <td width="14%">&nbsp;</td>
        </tr>      
        <tr>
          <td width="18%" align="right"><strong>终端所在位置</strong></td>
          <td width="68%"><input class="colors" name="postion" type="text" id="postion" value="" />
            <span id="postion_s"><font class="prompt">*名称只能由数字 字母 中文组成</font></span></td>
          <td width="14%">&nbsp;</td>
        </tr>      
        <tr>
          <td width="18%" align="right"><strong>音量</strong></td>
          <td width="68%"><input class="colors" name="volume" type="text" id="volume" value="50"><span id="volume_s"><font class="prompt">*只能是数字</font></span></td>
          <td width="14%">&nbsp;</td>
        </tr>             
        <tr>
          <td>&nbsp;</td>
          <td>
		  <input type="submit" name="button" id="button" value="添加" class="bt">&nbsp;&nbsp;
		  <input type="reset" name="reset" id="reset" value="取消" class="bt">		  </td>
          <td>&nbsp;</td>
        </tr>      
      </table>
    </form></td>
  </tr>
</table>
