<script language="javascript">

function trim(str)
{
   str=str.replace(/(^\s*)|(\s*$)/g,""); 
   return str;
}
function startFileTask()
{
	var qstr=getCheckboxItem();
	
	if(qstr==null||qstr=="")
	{
		alert("<{$task_manager.select_broadcast_task|capitalize}>");
		
		return void(0);	
	}
	else
	{
		location="do.php?act=ttsfiletaskstart_msg&id="+qstr+"";
	}	
}
function stopFileTask()
{
	var qstr=getCheckboxItem();
	
	if(qstr==null||qstr=="")
	{
		alert("<{$task_manager.select_broadcast_task|capitalize}>");
		return void(0);	
	}
	else
	{
		if(!window.confirm("<{$task_manager.suspending_task|capitalize}>"))
		{
				return void(0);
		}	
		else
		{
		  location="do.php?act=ttsfiletaskstop_msg&id="+qstr+"";
		}
	}
}
function modifyFileTask()
{
	var getid=getCheckboxItem();

	var count=0;
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			count++;
			if(count>=2)
			{
				alert("<{$task_manager.only_select_one|capitalize}>");
				return void(0);
			}
		}
	}
	if(getid==""||getid==null)
	{
		alert("<{$task_manager.select_broadcast_task|capitalize}>");
	}
	else
	{
		window.location.href = "taskttsmodify.php?id="+getid+"";
	}
}
function delTask()
{
	var qstr = getCheckboxItem();
	if(qstr==null||qstr=="")
	{
		alert("<{$task_manager.select_broadcast_task|capitalize}>");
		
		return void(0);	
	}
	else
	{
		if(!window.confirm("<{$task_manager.confirm_deleting|capitalize}>"))
		{
				return void(0);
		}	
		else
		{
				window.location.href = "do.php?act=ttstaskdel_msg&id="+qstr+"";
		}
	}
}
function start_file_task()
{
	var getid=getCheckboxItem();
	if(getid==null||getid=="")
	{
		alert("<{$task_manager.select_broadcast_task|capitalize}>");
		return void(0);	
	}
	else
	{
		if(window.confirm("<{$task_manager.enterenable|capitalize}>"))
			{
				location="do.php?act=start_tts_task_msg&id="+getid+"";
			}
			else
			{
				return void(0);
			}
	}	
}
/*****************
	停用文件广播
*****************/
function stop_file_task()
{

	var getid=getCheckboxItem();
	if(getid==null||getid=="")
	{
		alert("<{$task_manager.select_broadcast_task|capitalize}>");
		
		return void(0);	
	}
	else
	{	
		if(window.confirm("<{$task_manager.enterdisable|capitalize}>"))
			{
				location = "do.php?act=stop_tts_task_msg&id="+getid+"";
			}
			else
			{
				return void(0);
			}
	}
}
//获得选中文件的文件名
function getCheckboxItem()
{
	var allSel="";
	
	if(document.form2.id.checked)
	{
		allSel=document.form2.id.value;
		if(allSel==undefined)
		{
			allSel="";
		}
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			if(allSel=="")
				allSel=document.form2.id[i].value;
			else
				allSel=allSel+","+document.form2.id[i].value;
		}
	}
	return allSel;
}

//获得选中文件的文件名
function getChecktypeItem()
{
	var allSel="";
	
	if(document.form2.id.checked)
	{
		allSel=document.form2.id.value;
		if(allSel==undefined)
		{
			allSel="";
		}
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			if(allSel=="")
				allSel=document.form2.id[i].value;
			else
				allSel=allSel+","+document.form2.id[i].value;
		}
	}
	return allSel;
}

function selAll(aid)
{
	if(aid==0)
	{
		document.form2.id.checked=true;
	}
	for(i=0;i<document.form2.id.length;i++)
	{
		if(!document.form2.id[i].checked)
		{
			document.form2.id[i].checked=true;
		}
	}
}
function noSelAll(aid)
{
	document.form2.id.checked=false;
	
	for(i=0;i<document.form2.id.length;i++)
	{
		if(document.form2.id[i].checked)
		{
			document.form2.id[i].checked=false;
		}
	}
}
function getdayofweek(str)
{
   var dayofweek="";
   var count=0;
   for(i=0;i<str.length;i++)
   {
        if(str.charAt(i)=="1")
        {
			count++;
            switch(i)
            {
                case 0:
				dayofweek+="<{$Filetaskmanager.Sunday}>";
                
                break;
                case 1:
				dayofweek+="<{$Filetaskmanager.Monday}>";
                
                break;
                case 2:
				dayofweek+="<{$Filetaskmanager.Tuesday}>";
                
                break;
                case 3:
				dayofweek+="<{$Filetaskmanager.Wednesday}>";
                
                break;
                case 4:
				dayofweek+="<{$Filetaskmanager.Thursday}>";
                
                break;
                case 5:
				dayofweek+="<{$Filetaskmanager.Friday}>";
                
                break;
                case 6:
                dayofweek+="<{$Filetaskmanager.Saturday}>";
                break;  
            }
        }
   }
   if(count==7)
   {
   		return "<{$task_manager.every_day|capitalize}>";
   }
   return dayofweek;
}
